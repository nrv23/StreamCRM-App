name: stream-crm

services:
  postgres-projects:
    image: postgres:18
    container_name: postgres-projects
    restart: unless-stopped
    environment:
      POSTGRES_USER: streamCRMServerAdmin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_projects_data:/var/lib/postgresql
    networks:
      - stream-crm-network

  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: rabbitmq-stream-crm
    restart: unless-stopped
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq_streamcrm_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 30s
      retries: 3
      start_period: 20s
    networks:
      - stream-crm-network

volumes:
  postgres_projects_data:
    external: true
    name: stream-crm_postgres_projects_data

  rabbitmq_streamcrm_data:

networks:
  stream-crm-network:
    driver: bridge
